AutoName: BlurtText
Summary: Texts, pictures, and a computer inbox on your Wi-Fi
Description: |-
  BlurtText is an SMS and MMS app. A computer on the same Wi-Fi can read
  and send through the phone. There is no account, and message bodies are
  not uploaded.

  GIF search is optional. It uses KLIPY when a key is saved on the phone.
  Sending and receiving texts does not use that service.

